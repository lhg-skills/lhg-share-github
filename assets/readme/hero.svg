<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">把 GitHub 项目合规放到 Gitee 分享 — 先核许可，再导入</title>
  <desc id="desc">当用户给一个 GitHub 仓库链接、想在国内分享时使用：先研究该项目的许可与实际启动方式，再默认走 Gitee 组织镜像导入，成功后返回一句话 Agent 分享指令。</desc>

  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="360" rx="14" fill="#FFFBEB"/>
  <rect x="1" y="1" width="1198" height="358" rx="14" fill="none" stroke="#FDE68A" stroke-width="1.5"/>

  <g id="title-block">
    <rect x="64" y="62" width="12" height="12" fill="#059669"/>
    <text class="mono" x="86" y="74" font-size="17" letter-spacing="2" fill="#78716C">合规分享 · SKILL</text>
    <text class="sans" x="64" y="152" font-size="72" font-weight="700" fill="#292524">合规分享</text>
    <text class="sans" x="64" y="196" font-size="26" font-weight="700" fill="#B45309">把 GitHub 项目合规放到 Gitee</text>
    <text class="sans" x="64" y="238" font-size="21" fill="#292524">先核许可与署名，再导入，不冒充原创。</text>
  </g>

  <line x1="700" y1="56" x2="700" y2="256" stroke="#FDE68A" stroke-width="1.5"/>

  <g id="proof">
    <text class="sans" x="740" y="74" font-size="17" fill="#78716C">分享的三件事</text>
    <text class="mono" x="740" y="118" font-size="20" font-weight="700" fill="#059669">先核许可</text>
    <text class="sans" x="834" y="118" font-size="22" font-weight="700" fill="#292524">再导入分享</text>
    <text class="mono" x="740" y="164" font-size="20" font-weight="700" fill="#059669">默认组织</text>
    <text class="sans" x="834" y="164" font-size="22" font-weight="700" fill="#292524">lls-find-hub</text>
    <text class="mono" x="740" y="210" font-size="20" font-weight="700" fill="#059669">一句话指令</text>
    <text class="sans" x="854" y="210" font-size="22" font-weight="700" fill="#292524">对方 Agent 照做即成</text>
  </g>

  <line x1="64" y1="288" x2="1136" y2="288" stroke="#FDE68A" stroke-width="1.5"/>
  <g id="install">
    <text class="mono" x="64" y="327" font-size="16" fill="#78716C">安装</text>
    <text class="mono" x="140" y="327" font-size="20" font-weight="700" fill="#B45309">npx -y skills add lhg-skills/lhg-share-github -g --all</text>
  </g>
</svg>
